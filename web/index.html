<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>About Time</title>
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <h1 class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12.5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M16 9v7l4.5 2.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M16 16l-5.5 5" stroke="var(--hand)" stroke-width="1.8" stroke-linecap="round"/></svg>
      About Time
    </h1>
    <nav class="actions">
      <button class="btn" data-act="openClients">Settings</button>
    </nav>
  </header>

  <main>
    <section class="totals" id="totals" aria-label="Totals"></section>

    <section class="cal" aria-labelledby="monthTitle">
      <div class="cal-head">
        <h2 id="monthTitle"></h2>
        <div class="nav">
          <button class="icon-btn" data-act="prevMonth" aria-label="Previous month">‹</button>
          <button class="btn ghost" data-act="thisMonth">Today</button>
          <button class="icon-btn" data-act="nextMonth" aria-label="Next month">›</button>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <div class="scrim" id="scrim" data-act="close" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"></aside>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
